[package]
name = "godot-workshop"
version = "2.1.0"
description = "Godot 工坊桌面版(Tauri 宿主)"
authors = ["hunxisha"]
edition = "2021"
rust-version = "1.77"

# 桌面版沿用 desktop-v* 版本线(1.x 起至今),见 docs/tauri-migration-plan.md

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "default-tls", "socks", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
futures-util = "0.3"
sha2 = "0.10"
md5 = "0.7"
walkdir = "2"
trash = "5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
