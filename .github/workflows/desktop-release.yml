# 桌面版三平台打包与发布草稿(设计见 docs/desktop-app-plan.md §5)。
#
# 触发:
#   - 推送 desktop-v* tag(如 desktop-v1.0.0)→ 三平台 matrix 构建 + 建 **草稿** Release 并附产物
#   - workflow_dispatch 手动触发 → 只出 artifact 不发布,用于发版前试打包
#
# 为什么不用 electron-builder 自带的 publish:① v1.0 不做自动更新,update-info(latest.yml)无用;
# ② 只有 publish 配置而没有 repository 时会触发上游 computeChannelNames 空配置解引用报错(u26.15.3 实测);
# ③ 本仓库既有发布流程就是 gh CLI,口径统一。
#
# 版本号取自 desktop/package.json(桌面版独立版本线),与插件 zpx 版本号无关。
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 单平台失败不拖累其他平台,已成功的产物照常上传便于排查
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--win' }
          - { os: macos-latest, args: '--mac' }
          - { os: ubuntu-latest, args: '--linux' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 构建渲染层并同步桌面版静态资源
        run: npm run build:desktop

      - name: 打包(免签名,不做 publish)
        working-directory: desktop
        run: npx electron-builder --config electron-builder.cjs ${{ matrix.args }} --publish never
        env:
          # 免签名起步:禁止 electron-builder 自动发现本机签名证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # 逐架构列出:排除 windows 的「多架构合并安装包」与 blockmap(前者与分架构包重复,后者仅自动更新用)
          path: |
            desktop/release/*-x64-setup.exe
            desktop/release/*-arm64-setup.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建草稿 Release 并附三平台产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          VER="${TAG#desktop-}"
          # 发布说明随代码维护(desktop/RELEASE_NOTES.md),每次发版前更新它
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --draft --title "桌面版 $VER" \
              --notes-file desktop/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" -R "$REPO" dist/* --clobber
          echo "产物已附到草稿 Release($TAG);请在 GitHub 上核对后手动发布。"
