# 桌面版三平台打包与发布草稿(docs/desktop-app-plan.md §5)。
#
# 触发:
#   - 推送 desktop-v* tag(如 desktop-v1.0.0)→ 三平台 matrix 构建,
#     electron-builder 以 GitHub publish 配置写入同名 **draft** Release,人工核对后发布
#   - workflow_dispatch 手动触发 → 只出 artifact 不发布,用于发版前试打包
#
# 与 verify 工作流的关系:本工作流不跑 verify(发布前以最后一次 verify 绿为准)。
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 一平台失败不拖累其他平台,产物照常上传排查
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "--win" }
          - { os: macos-latest, args: "--mac" }
          - { os: ubuntu-latest, args: "--linux" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 构建渲染层并同步桌面版静态资源
        run: npm run build:desktop

      - name: electron-builder 打包(tag 触发时发布草稿,手动触发只出产物)
        working-directory: desktop
        run: >-
          npx electron-builder --config builder.json ${{ matrix.args }}
          ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
