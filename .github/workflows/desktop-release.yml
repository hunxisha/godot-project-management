# 桌面版 2.0(Tauri)三平台打包与发布草稿。
#
# 触发:desktop-v* tag → 三平台 matrix 构建 + 建草稿 Release;workflow_dispatch 只出 artifact。
# 与 1.x(Electron)工作流的差异:electron-builder → cargo tauri build(bundler 配置在
# src-tauri/tauri.conf.json);产物路径改为 src-tauri/target/release/bundle/。
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '' }
          - { os: ubuntu-latest, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Tauri 在 Linux 依赖 GTK/WebKitGTK 系统库(官方前置清单)
      - name: 安装 Tauri Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建渲染层(beforeBuildCommand 的显式版,产物进 src-ztools/dist)
        run: npm run build

      - name: cargo tauri build(免签名)
        run: npx tauri build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建草稿 Release 并附三平台产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          VER="${TAG#desktop-}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --draft --title "桌面版 $VER" \
              --notes-file desktop/RELEASE_NOTES.md
          fi
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" -R "$REPO" --clobber
          echo "产物已附到草稿 Release($TAG);请在 GitHub 上核对后手动发布。"
