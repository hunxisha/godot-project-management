# 提交/PR 上的最小验证:类型检查 + 全部回归断言。
#
# 只跑 `npm run verify` 这一条 —— 与本地提交前跑的命令完全一致,避免「CI 绿了但本地命令还红」
# 这类口径分叉。`verify` 内含 typecheck 与全部测试套件(主题/渲染层/preload/插件)。
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json 未声明 engines;README 要求 Node ≥ 18,vite 6 需要 18+。
          # 用 20 LTS 作为基线。
          node-version: 20
          cache: npm

      - name: 安装依赖(严格按 lockfile)
        run: npm ci
        # electron 只进 devDependencies 供桌面版用;verify 全程无头,跳过 ~100MB 二进制下载
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 类型检查 + 回归断言
        run: npm run verify

      - name: 构建产物(确认 vue-tsc + vite build 可过)
        run: npm run build
        # build 里已含 vue-tsc;单独跑一次是为了确认打包产物也能生成
        # (插件分发依赖 src-ztools/dist,见 README「开发」)

  # 桌面版 2.0(Tauri)壳的编译闸门:渲染层产物存在才能过 generate_context!(它会把
  # frontendDist 嵌进二进制)。领域命令落位后(T2-T4),测试与 clippy 在此追加。
  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 构建渲染层
        run: npm run build

      # Tauri 在 Linux 依赖 GTK/WebKitGTK 系统库(官方文档的前置清单)
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check(Tauri 壳编译)
        run: cargo check --manifest-path src-tauri/Cargo.toml
